name: ikuuu签到

on:
  schedule:
    # 北京时间每天 06:30（UTC 22:30）
    - cron: "30 22 * * *"
  workflow_dispatch:  # 支持手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 执行签到
        env:
          IKUUU_EMAIL: ${{ secrets.IKUUU_EMAIL }}
          IKUUU_PASSWD: ${{ secrets.IKUUU_PASSWD }}
          SCKEY: ${{ secrets.SCKEY }}
          RANDOM_SIGNIN: "false"
          MAX_RANDOM_DELAY: "0"
          BASE_URL: "https://ikuuu.win"
        run: python ikuuu_checkin.py
